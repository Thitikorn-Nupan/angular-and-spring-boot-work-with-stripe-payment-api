<ng-container *ngIf="modelCard">
  <div class="container py-5 ">
    <div class="row d-flex justify-content-center">
      <div class="col col-lg-9 col-xl-8">
        <div class="card">
          <div class="rounded-top text-white d-flex flex-row" [style]="{'background-image': getCssBackground(),'height':'270px'}">
            <div class="ms-4 mt-5 d-flex flex-column" style="width: 150px;">
              <img [src]="modelCard.icon" alt="Generic placeholder image" class="img-fluid img-thumbnail mt-4 mb-2" style="width: 150px; z-index: 1">
            </div>
            <div class="ms-3" style="margin-top: 130px; color: black">
              <h5>{{modelCard.fullname}}</h5>
              <p>{{modelCard.address}}</p>
            </div>
          </div>
          <div class="p-4 text-black bg-body-tertiary">
            <div class="d-flex justify-content-end text-center py-1 text-body">
              <ng-container *ngFor="let obj of modelCard.socialStatus" >
                <div class="px-3">
                  <p class="mb-1 h5">{{obj.int | number}}</p>
                  <p class="small text-muted mb-0">{{obj.description}}</p>
                </div>
              </ng-container>
            </div>
          </div>
          <div class="card-body p-4 text-black">
            <div class="d-flex justify-content-between align-items-center mb-4 text-body">
              <p class="lead fw-normal mb-0">Interests</p>
            </div>
            <div class="row g-2">
              <ng-container *ngFor="let skill of modelCard.skills">
                <div class="col mb-2">
                  <img [src]="skill" alt="image 1" class="rounded-1" style="width: inherit;">
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
